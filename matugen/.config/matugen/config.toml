# Wallpaper -> Material 3 colours for the Quickshell notch and Hyprland.
#
# Regenerated by quickshell's services/Wallpapers.qml every time the wallpaper
# changes, with:
#
#   matugen image <wallpaper> --mode dark --type scheme-smart --source-color-index 0
#
# scheme-smart picks the Material variant from the wallpaper's colourfulness
# (monochrome / neutral / tonal spot / vibrant) instead of always using the
# same scheme, which is what Caelestia's generator did. The mode is pinned to
# dark so the bar never flips to a light theme on a bright wallpaper.

[config]
# Use the most dominant colour in the image as the source colour. Without this
# matugen asks on stdin when an image has several good candidates, which just
# fails for a background process.
source_color_index = 0

# Material has no "success" role. Blend the old green towards the wallpaper
# hue so the online indicator stays green without clashing with the palette.
[config.custom_colors.success]
color = "#98c379"
blend = true

# Read by quickshell/services/Colours.qml (flat JSON, hex strings).
[templates.quickshell]
input_path = '~/.config/matugen/templates/quickshell.json'
output_path = '~/.cache/quickshell/colors.json'

# Read by the lua hyprland config (require("scheme.current")).
[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-scheme.lua'
output_path = '~/.config/hypr/scheme/current.lua'

[config.custom_colors]
red = { color = "#ff5555", blend = true }
green = { color = "#50fa7b", blend = true }
yellow = { color = "#f1fa8c", blend = true }
blue = { color = "#6272a4", blend = true }
magenta = { color = "#ff79c6", blend = true }
cyan = { color = "#8be9fd", blend = true }
